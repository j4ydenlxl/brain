<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo</title>
<style>
  :root { color-scheme: light dark; --ink: #1b1b1b; --paper: #fafaf7; --line: #d9d9d2; --muted: #6b6b66; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ecece6; --paper: #161615; --line: #34342f; --muted: #9a9a92; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 32rem; margin: 3rem auto; padding: 0 16px; }
  h1 { font-size: 1.6rem; margin: 0 0 1rem; }
  form { display: flex; gap: .5rem; }
  input[type="text"] { flex: 1; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; font: inherit; }
  button { padding: .55rem .9rem; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 1rem 0 0; }
  li { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .5rem 0; border-bottom: 1px solid var(--line); }
  li.done span { text-decoration: line-through; color: var(--muted); }
  li.empty { color: var(--muted); }
  label { display: flex; align-items: center; gap: .5rem; flex: 1; }
</style>
</head>
<body>
<main>
  <h1>Todo</h1>
  <form id="add-form" autocomplete="off">
    <input id="todo-text" type="text" placeholder="What needs doing?" aria-label="New todo">
    <button id="add" type="submit">Add</button>
  </form>
  <ul id="list"></ul>
</main>
<script type="module" src="./app.mjs"></script>
</body>
</html>
