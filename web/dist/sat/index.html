<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAT Math Practice</title>
<meta name="description" content="Digital SAT math practice with a real Desmos calculator, random-fire and full-test modes, and worked explanations.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
:root{
  --blue:#324dc7; --blue-d:#26399b; --ink:#1e1e1e; --mut:#5b5b5b;
  --line:#d4d4d4; --bg:#fff; --soft:#f5f5f5; --red:#c13515; --ok:#0b7a3b;
  --chrome:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --body:"Noto Serif",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--chrome);color:var(--ink);background:var(--bg);overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
.hide{display:none!important}

#shell{display:flex;flex-direction:column;height:100vh}
header#top{flex:0 0 auto;padding:10px 24px 0}
.toprow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;min-height:56px}
.sect{font-weight:700;font-size:15px}
.dirbtn{background:none;border:none;font-size:13px;color:var(--ink);text-decoration:underline;padding:2px 0}
.clockwrap{text-align:center}
.clock{font-size:22px;font-weight:700;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.clock.warn{color:var(--red)}
.clockbtn{margin-top:2px;border:1px solid #767676;background:#fff;border-radius:16px;font-size:12px;padding:2px 12px}
.tools{display:flex;justify-content:flex-end;gap:22px;align-items:center}
.tool{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:2px 4px;border-radius:6px}
.tool:hover{background:var(--soft)}
.tool svg{width:22px;height:22px}
.tool.on{color:var(--blue)}
.rule{border-bottom:2px dashed #000;margin:8px 0 0}

#panes{flex:1 1 auto;display:flex;min-height:0;position:relative}
.pane{overflow-y:auto;padding:22px 26px 30px;min-width:0}
#leftpane{flex:0 0 50%}
#split{flex:0 0 14px;cursor:col-resize;position:relative;background:transparent}
#split::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--line)}
#split .grip{position:absolute;top:50%;left:1px;transform:translateY(-50%);width:12px;height:44px;border-radius:6px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#888;font-size:10px;line-height:1}
#rightpane{flex:1 1 auto}
body.single #leftpane,body.single #split{display:none}
body.single #rightpane{max-width:820px;margin:0 auto}

.qbar{display:flex;align-items:center;gap:14px;background:var(--soft);border-radius:4px;padding:6px 10px;margin-bottom:16px}
.qnum{background:#1e1e1e;color:#fff;width:26px;height:26px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.markbtn{background:none;border:none;display:flex;align-items:center;gap:6px;font-size:13px}
.markbtn svg{width:15px;height:15px}
.markbtn.on{color:var(--red);font-weight:600}
.abcbtn{margin-left:auto;background:#fff;border:1px solid #767676;border-radius:16px;font-size:12px;font-weight:700;padding:3px 10px;letter-spacing:.5px}
.abcbtn.on{background:#1e1e1e;color:#fff;border-color:#1e1e1e}
.stem{font-family:var(--body);font-size:17px;line-height:1.65;margin-bottom:8px}
.stem p{margin:0 0 12px}
.prompt{font-family:var(--body);font-size:17px;line-height:1.65;margin:14px 0 18px}
.figwrap{text-align:center;margin:10px 0 18px}
.figwrap svg{max-width:100%;height:auto}
table.data{border-collapse:collapse;margin:8px auto 16px;font-family:var(--body);font-size:16px}
table.data th,table.data td{border:1px solid #1e1e1e;padding:6px 14px;text-align:center}
table.data th{background:var(--soft);font-weight:700}

.choices{display:flex;flex-direction:column;gap:12px;max-width:640px}
.crow{display:flex;align-items:center;gap:8px}
.choice{flex:1 1 auto;display:flex;align-items:flex-start;gap:12px;border:2px solid #767676;border-radius:8px;background:#fff;padding:11px 14px;text-align:left;font-family:var(--body);font-size:17px;line-height:1.5}
.choice:hover{border-color:#1e1e1e}
.letter{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1.5px solid #1e1e1e;display:flex;align-items:center;justify-content:center;font-family:var(--chrome);font-size:13px;font-weight:700;margin-top:1px}
.choice.sel{border-color:var(--blue)}
.choice.sel .letter{background:var(--blue);border-color:var(--blue);color:#fff}
.choice.out{opacity:.45}
.choice.out .ctext{text-decoration:line-through}
.choice.correct{border-color:var(--ok);background:#f2fbf5}
.choice.wrong{border-color:var(--red);background:#fdf3f1}
.xbtn{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1px solid #767676;background:#fff;font-size:12px;font-weight:700;display:none;align-items:center;justify-content:center}
body.abc .xbtn{display:flex}
.xbtn.undo{width:auto;padding:0 8px;border-radius:12px;font-size:11px;font-weight:400}

.sprbox{max-width:420px}
.sprbox input{width:100%;font-family:var(--body);font-size:20px;padding:10px 12px;border:2px solid #767676;border-radius:6px}
.sprbox input:focus{outline:none;border-color:var(--blue)}
.sprprev{margin-top:8px;font-size:13px;color:var(--mut)}
.sprhelp{margin:0 0 12px;font-size:13px;color:var(--mut);max-width:640px;line-height:1.5}

footer#bot{flex:0 0 auto;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 24px}
.who{font-weight:700;font-size:14px}
.navbtn{background:#1e1e1e;color:#fff;border:none;border-radius:6px;padding:8px 16px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.acts{display:flex;justify-content:flex-end;gap:10px}
.pill{background:var(--blue);color:#fff;border:none;border-radius:20px;padding:9px 26px;font-size:15px;font-weight:700}
.pill:hover{background:var(--blue-d)}
.pill.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.pill:disabled{opacity:.4;cursor:default}

.pop{position:fixed;background:#fff;border:1px solid #adadad;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.28);z-index:60;display:flex;flex-direction:column}
.pophead{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:move;user-select:none;background:#fafafa;border-radius:10px 10px 0 0}
.pophead .t{font-size:13px;font-weight:700}
.pophead .sp{margin-left:auto;display:flex;gap:4px}
.iconbtn{background:none;border:none;width:26px;height:26px;border-radius:5px;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}
.iconbtn:hover{background:#ececec}
.popbody{flex:1 1 auto;overflow:auto;min-height:0}
.rsz{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize}
.rsz::after{content:"";position:absolute;right:3px;bottom:3px;width:8px;height:8px;border-right:2px solid #9a9a9a;border-bottom:2px solid #9a9a9a}
#calc{width:460px;height:520px;left:24px;top:110px}
#calcbody{background:#fff}
#ref{width:660px;height:470px;left:120px;top:120px}
#refbody{padding:16px 20px;font-family:var(--body);font-size:15px;line-height:1.6}
#ref .rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
#ref .rcell{border:1px solid var(--line);border-radius:6px;padding:10px;text-align:center}
#ref .rcell .f{font-size:15px;margin-top:6px}
#ref .note{margin-top:14px;font-size:14px;color:var(--mut)}

#navpop{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);width:min(560px,92vw);z-index:60}
#navpop .popbody{padding:16px}
.navlegend{display:flex;gap:18px;justify-content:center;font-size:12px;padding:0 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.navlegend span{display:flex;align-items:center;gap:6px}
.lgbox{width:14px;height:14px;border:1.5px dashed #767676;border-radius:2px;display:inline-block}
.lgbox.cur{border:2px solid #1e1e1e;background:#fff}
.lgbox.ans{background:var(--blue);border:1.5px solid var(--blue)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:10px}
.ncell{position:relative;height:40px;border:1.5px dashed #767676;border-radius:3px;background:#fff;font-size:14px;font-weight:600}
.ncell.ans{background:var(--blue);color:#fff;border:1.5px solid var(--blue)}
.ncell.cur{outline:2px solid #1e1e1e;outline-offset:2px}
.ncell .fl{position:absolute;top:-8px;right:-5px;color:var(--red);font-size:13px}
.navfoot{text-align:center;margin-top:16px}

.screen{position:fixed;inset:0;background:#fff;z-index:80;overflow:auto;padding:40px 24px}
.wrap{max-width:880px;margin:0 auto}
h1{font-size:30px;margin:0 0 6px}
h2{font-size:21px;margin:26px 0 10px}
.sub{color:var(--mut);font-size:15px;margin:0 0 24px;line-height:1.6}
.card{border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.card h3{margin:0 0 6px;font-size:18px}
.card p{margin:0 0 14px;color:var(--mut);font-size:14px;line-height:1.55}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.opt{border:1.5px solid #767676;background:#fff;border-radius:18px;padding:6px 14px;font-size:13px}
.opt.on{background:var(--blue);border-color:var(--blue);color:#fff}
.fieldrow{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mut)}
.field input,.field select{font-family:inherit;font-size:15px;padding:7px 10px;border:1.5px solid #767676;border-radius:6px;background:#fff;color:var(--ink)}
.field input{width:120px}
.muted{color:var(--mut);font-size:13px;line-height:1.6}
.scoreline{display:flex;gap:28px;flex-wrap:wrap;align-items:baseline;margin-bottom:8px}
.bignum{font-size:44px;font-weight:700;line-height:1}
.bl{font-size:13px;color:var(--mut)}
.rtab{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.rtab th,.rtab td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.rtab th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.tag.E{background:#eef7ee;border-color:#cbe3cb}
.tag.M{background:#fdf6e6;border-color:#ecdcae}
.tag.H{background:#fdeeea;border-color:#f0cabd}
.ok{color:var(--ok);font-weight:700}
.bad{color:var(--red);font-weight:700}

.expl{margin-top:22px;border-left:3px solid var(--blue);background:#f7f9ff;border-radius:0 8px 8px 0;padding:14px 18px;max-width:700px}
.expl h4{margin:0 0 8px;font-size:14px;letter-spacing:.4px;text-transform:uppercase;color:var(--blue)}
.expl ol{margin:0;padding-left:20px;font-family:var(--body);font-size:16px;line-height:1.7}
.expl li{margin-bottom:8px}
.expl .keyline{font-family:var(--body);font-size:16px;margin-top:10px;padding-top:10px;border-top:1px solid #dde3f7}
.verdict{margin-top:18px;font-size:16px;font-weight:700}
.fbrow{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
details.dir{margin:0 0 18px}
details.dir summary{cursor:pointer;font-size:14px}
details.dir div{font-family:var(--body);font-size:15px;line-height:1.6;margin-top:8px;color:var(--mut)}

@media (max-width:820px){
  body.single #rightpane{max-width:none}
  .toprow{grid-template-columns:1fr auto;row-gap:8px}
  .tools{grid-column:1/-1;justify-content:flex-start;gap:16px}
  #leftpane{flex-basis:44%}
}
</style>
</head>
<body class="single">

<div id="shell" class="hide">
  <header id="top">
    <div class="toprow">
      <div>
        <div class="sect" id="sectlabel">Section 2: Math</div>
        <button class="dirbtn" id="dirbtn">Directions &#8964;</button>
      </div>
      <div class="clockwrap">
        <div class="clock" id="clock">00:00</div>
        <button class="clockbtn" id="clockbtn">Hide</button>
      </div>
      <div class="tools">
        <button class="tool" id="t-calc" title="Calculator">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="2" width="16" height="20" rx="2"/><rect x="7" y="5" width="10" height="4"/><path d="M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01M16 17h.01"/></svg>
          <span>Calculator</span>
        </button>
        <button class="tool" id="t-ref" title="Reference">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4h7a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4z"/><path d="M20 4h-7a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h7z"/></svg>
          <span>Reference</span>
        </button>
        <button class="tool" id="t-split" title="Split screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
          <span>Split</span>
        </button>
        <button class="tool" id="t-quit" title="Exit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          <span>Exit</span>
        </button>
      </div>
    </div>
    <div class="rule"></div>
  </header>

  <div id="panes">
    <section class="pane" id="leftpane"></section>
    <div id="split"><div class="grip">&#8942;</div></div>
    <section class="pane" id="rightpane"></section>
  </div>

  <footer id="bot">
    <div class="who" id="who">Practice</div>
    <div style="text-align:center"><button class="navbtn" id="navbtn">Question 1 of 1 &#8963;</button></div>
    <div class="acts">
      <button class="pill ghost" id="backbtn">Back</button>
      <button class="pill" id="nextbtn">Next</button>
    </div>
  </footer>
</div>

<div class="pop hide" id="calc">
  <div class="pophead" data-drag="calc">
    <span class="t">Calculator</span>
    <span class="sp">
      <button class="iconbtn" id="calc-dock" title="Dock to left half">&#9635;</button>
      <button class="iconbtn" id="calc-close" title="Close">&#10005;</button>
    </span>
  </div>
  <div class="popbody" id="calcbody"></div>
  <div class="rsz" data-rsz="calc"></div>
</div>

<div class="pop hide" id="ref">
  <div class="pophead" data-drag="ref">
    <span class="t">Reference</span>
    <span class="sp"><button class="iconbtn" id="ref-close">&#10005;</button></span>
  </div>
  <div class="popbody" id="refbody"></div>
  <div class="rsz" data-rsz="ref"></div>
</div>

<div class="pop hide" id="navpop">
  <div class="pophead" style="cursor:default">
    <span class="t" id="navtitle">Section 2: Math</span>
    <span class="sp"><button class="iconbtn" id="nav-close">&#10005;</button></span>
  </div>
  <div class="popbody">
    <div class="navlegend">
      <span><i class="lgbox cur"></i> Current</span>
      <span><i class="lgbox"></i> Unanswered</span>
      <span><i class="lgbox ans"></i> Answered</span>
      <span style="color:var(--red)">&#9873; For Review</span>
    </div>
    <div class="navgrid" id="navgrid"></div>
    <div class="navfoot"><button class="pill ghost" id="gotoreview">Go to Review Page</button></div>
  </div>
</div>

<div class="screen" id="home"></div>
<div class="screen hide" id="review"></div>
<div class="screen hide" id="results"></div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://www.desmos.com/api/v1.11/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
<script src="/sat/gen-core.js"></script>
<script src="/sat/gen-h.js"></script>
<script src="/sat/gen-p.js"></script>
<script src="/sat/gen-q.js"></script>
<script src="/sat/gen-s.js"></script>
<script src="/sat/app.js"></script>
</body>
</html>
