<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn — SAT, Algebra 2, Precalculus, Calculus</title>
<meta name="description" content="Every topic taught in steps, every question style named, adaptive drills that climb as you improve, and spaced review that brings it back before you forget it.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   Tokens. One accent, one warm signal colour, everything else is paper and ink.
   =========================================================================== */
:root{
  --accent:#2f47b8; --accent-d:#22348f; --accent-soft:#eef1fd; --accent-line:#c9d2f2;
  --ink:#14161b; --ink-2:#3e444f; --mut:#6e7480;
  --bg:#ffffff; --panel:#f7f8fa; --panel-2:#f1f3f7; --line:#e4e7ec; --line-2:#d6dae2;
  --ok:#1a7f42; --ok-soft:#f0faf3; --ok-line:#bfe6cd;
  --bad:#b4291f; --bad-soft:#fdf4f2; --bad-line:#f0cdc7;
  --warn:#8a5a00; --warn-soft:#fdf8ec; --warn-line:#ecd9a8;
  --shadow:0 1px 2px rgba(18,22,40,.05), 0 8px 24px rgba(18,22,40,.06);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --side:286px; --toc:216px; --topbar:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent:#8c9dff; --accent-d:#a6b3ff; --accent-soft:#191d31; --accent-line:#33406e;
    --ink:#e9ebf0; --ink-2:#b6bcc9; --mut:#868d9c;
    --bg:#0e1014; --panel:#14171d; --panel-2:#1a1e25; --line:#242932; --line-2:#333944;
    --ok:#4ec27c; --ok-soft:#10231a; --ok-line:#22492f;
    --bad:#f08a7e; --bad-soft:#261614; --bad-line:#4d2a25;
    --warn:#e0b45f; --warn-soft:#241e12; --warn-line:#4a3c1e;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --accent:#8c9dff; --accent-d:#a6b3ff; --accent-soft:#191d31; --accent-line:#33406e;
  --ink:#e9ebf0; --ink-2:#b6bcc9; --mut:#868d9c;
  --bg:#0e1014; --panel:#14171d; --panel-2:#1a1e25; --line:#242932; --line-2:#333944;
  --ok:#4ec27c; --ok-soft:#10231a; --ok-line:#22492f;
  --bad:#f08a7e; --bad-soft:#261614; --bad-line:#4d2a25;
  --warn:#e0b45f; --warn-soft:#241e12; --warn-line:#4a3c1e;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:74px}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--accent-soft);color:var(--ink)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.hide{display:none !important}

/* ================================ top bar ================================ */
#top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  padding:0 18px;height:var(--topbar);background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
#brand{font-weight:800;letter-spacing:-.025em;font-size:15px;cursor:pointer;white-space:nowrap}
#brand span{color:var(--accent);font-weight:500}
#tracks{display:flex;gap:2px;margin-left:10px;padding:3px;background:var(--panel-2);border-radius:10px}
.trk{border:none;background:none;color:var(--mut);border-radius:7px;
  padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;letter-spacing:-.01em;
  transition:color .14s,background .14s}
.trk:hover{color:var(--ink)}
.trk.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(18,22,40,.09)}
#topright{margin-left:auto;display:flex;align-items:center;gap:7px}
.tbtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 11px;
  font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:6px;
  transition:border-color .14s,background .14s}
.tbtn:hover{border-color:var(--line-2);background:var(--panel)}
.tbtn.hot{border-color:var(--warn-line);background:var(--warn-soft);color:var(--warn)}
.tbtn .cnt{background:var(--warn);color:#fff;border-radius:99px;font-size:10.5px;font-weight:700;
  padding:1px 6px;line-height:1.5}
:root[data-theme="dark"] .tbtn .cnt{color:#241e12}
#menubtn{display:none}
/* reading progress hairline */
#prog{position:fixed;top:var(--topbar);left:0;height:2px;background:var(--accent);width:0;z-index:45;
  transition:width .1s linear;opacity:.85}

/* ================================ layout ================================ */
#wrap{display:flex;align-items:flex-start;min-height:calc(100vh - var(--topbar))}
#side{width:var(--side);flex:0 0 var(--side);border-right:1px solid var(--line);
  position:sticky;top:var(--topbar);height:calc(100vh - var(--topbar));overflow-y:auto;
  background:var(--panel);scrollbar-width:thin}
#sidehead{padding:16px 18px 6px;font-size:10.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mut)}
.unit{border-top:1px solid var(--line)}
.unit:first-child{border-top:none}
.unit>h4{margin:0;padding:11px 18px;font-size:12.5px;font-weight:650;color:var(--ink-2);
  display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;letter-spacing:-.01em}
.unit>h4:hover{color:var(--ink)}
.unit>h4 .caret{color:var(--mut);font-size:9px;transition:transform .16s ease}
.unit.closed>h4 .caret{transform:rotate(-90deg)}
.unit.closed .ul{display:none}
.unit>h4 .ucount{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--mut);
  font-variant-numeric:tabular-nums}
.ul{padding:0 0 8px}
.li{display:flex;align-items:center;gap:10px;padding:6px 18px 6px 30px;font-size:12.8px;
  color:var(--ink-2);cursor:pointer;line-height:1.4;border-left:2px solid transparent;
  transition:background .12s,color .12s}
.li:hover{background:var(--panel-2);color:var(--ink)}
.li.on{background:var(--accent-soft);color:var(--accent-d);font-weight:650;border-left-color:var(--accent)}
.dot{flex:0 0 8px;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--bg)}
.dot.seen{border-color:var(--accent);background:var(--accent-soft)}
.dot.done{border-color:var(--ok);background:var(--ok)}
.dot.due{border-color:var(--warn);background:var(--warn)}
#page{flex:1;min-width:0;display:flex;justify-content:center;gap:34px;padding:0 34px}
#main{flex:1;min-width:0;max-width:760px;padding:30px 0 110px;animation:rise .28s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#main{animation:none}html{scroll-behavior:auto}}
#toc{display:none;width:var(--toc);flex:0 0 var(--toc);position:sticky;top:calc(var(--topbar) + 26px);
  max-height:calc(100vh - var(--topbar) - 60px);overflow-y:auto;padding:30px 0 40px}
@media (min-width:1220px){#toc.show{display:block}}
#toc .tochead{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mut);margin-bottom:9px}
#toc a{display:block;padding:4px 0 4px 12px;font-size:12.3px;color:var(--mut);line-height:1.4;
  border-left:2px solid var(--line);transition:color .13s,border-color .13s}
#toc a:hover{color:var(--ink);text-decoration:none;border-left-color:var(--line-2)}
#toc a.on{color:var(--accent);border-left-color:var(--accent);font-weight:600}

/* ================================ headings & prose ================================ */
.crumb{font-size:11.5px;color:var(--mut);font-weight:600;letter-spacing:.01em;margin-bottom:9px}
.crumb a{color:var(--mut)}
.crumb a:hover{color:var(--ink)}
h1{font-size:33px;line-height:1.15;letter-spacing:-.028em;margin:0 0 10px;font-weight:700}
h2{font-size:19px;letter-spacing:-.017em;margin:40px 0 12px;font-weight:650;line-height:1.3;
  display:flex;align-items:baseline;gap:10px}
h2 .num{font-size:11.5px;font-weight:700;color:var(--accent);letter-spacing:.06em;
  font-variant-numeric:tabular-nums;flex:0 0 auto;padding-top:2px}
h3{font-size:15px;margin:26px 0 8px;font-weight:650;letter-spacing:-.01em}
.lead{font-family:var(--serif);font-size:17px;line-height:1.6;color:var(--ink-2);margin:0 0 18px;
  letter-spacing:-.003em}
.prose{font-family:var(--serif);font-size:16.2px;line-height:1.74;color:var(--ink);letter-spacing:-.002em}
.prose p{margin:0 0 13px}
.prose ul,.prose ol{margin:0 0 13px;padding-left:22px}
.prose li{margin:0 0 7px}
.prose b,.prose strong{font-weight:650}
.muted{color:var(--mut);font-size:12.5px;line-height:1.55}
.katex{font-size:1.03em}

/* meta line under an h1 */
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mut);font-weight:550;
  margin:0 0 18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta .kdot{width:3px;height:3px;border-radius:50%;background:var(--line-2)}

/* ================================ cards & boxes ================================ */
.card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 16px;background:var(--bg)}
.card h3{margin-top:0}
.box{border:1px solid var(--accent-line);border-left-width:3px;background:var(--accent-soft);
  border-radius:4px 10px 10px 4px;padding:12px 16px;margin:14px 0;
  font-family:var(--serif);font-size:15.4px;line-height:1.65}
.box b.tag{display:block;font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:5px;color:var(--accent-d)}
.box.trap{border-color:var(--bad-line);background:var(--bad-soft)}
.box.trap b.tag{color:var(--bad)}
.box.nuance{border-color:var(--warn-line);background:var(--warn-soft)}
.box.nuance b.tag{color:var(--warn)}
.box.recall{border-color:var(--ok-line);background:var(--ok-soft)}
.box.recall b.tag{color:var(--ok)}
.box.rule{border-color:var(--accent-line);background:var(--accent-soft)}

.ex{border:1px solid var(--line);border-radius:12px;margin:16px 0;overflow:hidden;background:var(--bg)}
.ex .exq{background:var(--panel);padding:13px 17px;font-family:var(--serif);font-size:15.6px;
  line-height:1.6;border-bottom:1px solid var(--line);position:relative;padding-left:17px}
.ex .exq .exlab{display:block;font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.ex ol{margin:0;padding:14px 17px 14px 36px;font-family:var(--serif);font-size:15.4px;line-height:1.7}
.ex ol li{margin:0 0 9px}
.ex ol li::marker{color:var(--accent);font-weight:700;font-family:var(--sans);font-size:.8em}
.ex .note{padding:0 17px 14px;font-family:var(--serif);font-size:14.6px;color:var(--ink-2);
  line-height:1.6}
.ex .note::before{content:"Why this works  ";font-family:var(--sans);font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}

table.dtab{border-collapse:collapse;margin:10px 0 14px;font-family:var(--sans);font-size:13.5px;font-variant-numeric:tabular-nums}
table.dtab th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  padding:7px 14px 7px 0;border-bottom:1px solid var(--line);white-space:nowrap}
table.dtab td{padding:7px 16px 7px 0;border-bottom:1px solid var(--line);color:var(--ink)}
table.styles{width:100%;border-collapse:collapse;font-size:13.5px;margin:12px 0 4px}
table.styles th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mut);border-bottom:1px solid var(--line-2);padding:0 12px 7px 0;font-weight:700}
table.styles td{border-bottom:1px solid var(--line);padding:11px 12px 11px 0;vertical-align:top;
  font-family:var(--serif);font-size:14.8px;line-height:1.55}
table.styles tr:hover td{background:var(--panel)}
table.styles td.nm{font-family:var(--sans);font-weight:650;font-size:13px;width:30%;letter-spacing:-.01em}

.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px;margin:10px 0 0}
.vid{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;font-size:13px;color:var(--ink-2);font-weight:550;background:var(--bg);
  line-height:1.35;transition:border-color .14s,transform .14s}
.vid:hover{border-color:var(--line-2);text-decoration:none;transform:translateY(-1px)}
.vid .yt{color:#d3372a;font-size:13px;flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12px;
  color:var(--ink-2);background:var(--bg);font-weight:550}

/* ================================ buttons ================================ */
.pill{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:9px;
  padding:10px 18px;font-size:13.5px;font-weight:650;cursor:pointer;letter-spacing:-.01em;
  transition:background .14s,transform .1s}
:root[data-theme="dark"] .pill{color:#0e1014}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill{color:#0e1014}}
.pill:hover{background:var(--accent-d);border-color:var(--accent-d)}
.pill:active{transform:translateY(1px)}
.pill.ghost{background:var(--bg);color:var(--accent);border-color:var(--line-2)}
.pill.ghost:hover{background:var(--panel);border-color:var(--accent-line)}
.pill:disabled{opacity:.42;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 0}

/* ================================ mastery strip ================================ */
.mastery{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border:1px solid var(--line);
  border-radius:12px;padding:14px 18px;margin:0 0 6px;background:var(--panel)}
.mlab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);
  margin-bottom:6px}
.mval{font-size:13.5px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.steps5{display:flex;gap:3px;margin-top:6px}
.steps5 i{width:26px;height:4px;border-radius:2px;background:var(--line-2);display:block}
.steps5 i.on{background:var(--accent)}
.steps5 i.top{background:var(--ok)}
.bar{height:4px;border-radius:3px;background:var(--line);overflow:hidden;flex:1;max-width:200px;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s cubic-bezier(.2,.7,.3,1)}
.bar i.full{background:var(--ok)}

/* ================================ drill ================================ */
#drill{scroll-margin-top:72px}
.qcard{border:1px solid var(--line);border-radius:14px;background:var(--bg);box-shadow:var(--shadow);
  overflow:hidden;margin:6px 0 0}
.qbar{display:flex;align-items:center;gap:14px;padding:10px 18px;font-size:11.5px;color:var(--mut);
  background:var(--panel);border-bottom:1px solid var(--line);font-weight:600;letter-spacing:.01em;
  flex-wrap:wrap}
.qbar .tier{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font-weight:650}
.qbar .pips{display:inline-flex;gap:2px}
.qbar .pip{width:13px;height:3px;border-radius:2px;background:var(--line-2)}
.qbar .pip.on{background:var(--accent)}
.qbody{padding:18px}
.qtext{font-family:var(--serif);font-size:16.6px;line-height:1.68;margin:0 0 16px}
.qtext p{margin:0 0 11px}
.opts2{display:flex;flex-direction:column;gap:8px;max-width:640px}
.opt{display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--line);border-radius:10px;
  padding:12px 15px;cursor:pointer;background:var(--bg);font-family:var(--serif);font-size:15.6px;
  line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--line-2);background:var(--panel)}
.opt .ltr{flex:0 0 22px;height:22px;border:1.4px solid var(--line-2);border-radius:6px;display:flex;
  align-items:center;justify-content:center;font-family:var(--sans);font-size:11px;font-weight:700;
  color:var(--mut);margin-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .ltr{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .ltr{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .ltr{background:var(--bad);border-color:var(--bad);color:#fff}
.sprbox{max-width:300px}
.sprbox input{width:100%;padding:12px 14px;font-size:16.5px;font-family:var(--serif);background:var(--bg);
  color:var(--ink);border:1.5px solid var(--line-2);border-radius:10px;outline:none;transition:border-color .14s}
.sprbox input:focus{border-color:var(--accent)}
.qfoot{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:14px 18px;
  border-top:1px solid var(--line);background:var(--panel)}
.qfoot .kbd{margin-left:auto;font-size:11px;color:var(--mut);font-weight:550}
kbd{font-family:var(--sans);font-size:10.5px;border:1px solid var(--line-2);border-bottom-width:2px;
  border-radius:5px;padding:1px 5px;background:var(--bg);color:var(--ink-2);font-weight:600}
.verdict{font-weight:700;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px;
  display:flex;align-items:center;gap:8px}
.verdict.ok{color:var(--ok)}
.verdict.no{color:var(--bad)}
.fb{padding:16px 18px;border-top:1px solid var(--line);animation:rise .22s cubic-bezier(.2,.7,.3,1)}
.steps{border:1px solid var(--accent-line);border-left-width:3px;background:var(--accent-soft);
  border-radius:4px 10px 10px 4px;padding:13px 16px;margin:10px 0 0}
.steps ol{margin:0;padding-left:20px;font-family:var(--serif);font-size:15.3px;line-height:1.7}
.steps ol li{margin:0 0 7px}
.steps ol li::marker{color:var(--accent);font-weight:700}
.steps .take{font-family:var(--serif);font-size:14.8px;margin-top:10px;padding-top:10px;
  border-top:1px solid var(--accent-line)}
.hintbtn{background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:650;cursor:pointer;
  padding:0;margin-top:4px}
.hintbtn:hover{text-decoration:underline;text-underline-offset:2px}
.movemsg{font-size:12.5px;color:var(--mut);font-weight:550}

/* ================================ dashboard ================================ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:11px;margin:14px 0 6px}
.tile{border:1px solid var(--line);border-radius:12px;padding:15px 16px;background:var(--bg);cursor:pointer;
  transition:border-color .14s,transform .14s,box-shadow .14s;display:flex;flex-direction:column}
.tile:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:var(--shadow)}
.tile h4{margin:0 0 5px;font-size:13.8px;font-weight:650;letter-spacing:-.012em;line-height:1.3}
.tile p{margin:0 0 10px;font-size:12.3px;color:var(--mut);line-height:1.5;flex:1}
.tile .bar{max-width:none;margin:0}
.stat{display:flex;gap:34px;margin:18px 0 6px;flex-wrap:wrap;padding:18px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat div b{display:block;font-size:27px;letter-spacing:-.03em;font-weight:700;font-variant-numeric:tabular-nums;
  line-height:1.1}
.stat div span{font-size:10.5px;color:var(--mut);font-weight:700;letter-spacing:.09em;text-transform:uppercase}

/* ================================ calculator ================================ */
#calcwrap{position:fixed;left:24px;bottom:24px;width:430px;height:450px;z-index:60;
  background:var(--bg);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden}
#calchead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);
