<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DILATION / BRAIN</title>
<meta name="description" content="A computational organism grown in your browser: thousands of typed cells on a folded cortical sheet, wired by a connectome, ticking in microseconds.">
<style>
:root { color-scheme: dark; --ink: #e8eefc; --dim: #7f8ba6; --line: rgba(150,180,255,0.14); --glass: rgba(10,14,26,0.62); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #02030a; color: var(--ink);
  font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow: hidden; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#hud { position: fixed; inset: 0; pointer-events: none; }
.panel { position: absolute; pointer-events: auto; background: var(--glass); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px); }
.state { top: 16px; left: 16px; width: 268px; }
.conduits { top: 16px; right: 16px; width: 372px; }
.cell { bottom: 68px; left: 16px; width: 330px; max-height: 58vh; overflow: auto; }
.help { bottom: 16px; left: 16px; right: 16px; padding: 9px 14px; color: var(--dim); }
.help b { color: var(--ink); font-weight: 600; }
.ttl { letter-spacing: 0.16em; font-size: 11px; margin-bottom: 9px; text-transform: uppercase; }
.dim { color: var(--dim); }
.rule { height: 1px; background: var(--line); margin: 9px 0; }
.row { display: flex; justify-content: space-between; gap: 10px; padding: 1px 0; }
.row .k { color: var(--dim); }
.row .v { text-align: right; }
.kind { font-size: 15px; letter-spacing: 0.02em; margin-bottom: 2px; }
.doc { color: var(--dim); margin-bottom: 9px; }
.port { display: inline-block; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; margin: 1px 0; }
.note { color: var(--dim); margin-top: 8px; font-size: 11px; }
table { width: 100%; border-collapse: collapse; }
/* grouped numbers carry a thin space, and at 5000 majors an edge count is wide enough to
   wrap onto a second line and push the whole row out of shape. A number is one word. */
th, td { white-space: nowrap; }
th { color: var(--dim); font-weight: 400; text-align: left; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
td { padding: 1px 0; }
.n { text-align: right; padding-left: 9px; }
#boot { position: fixed; inset: 0; display: grid; place-items: center; background: #02030a;
  letter-spacing: 0.24em; text-transform: uppercase; color: var(--dim); z-index: 5; }
#grow { position: fixed; bottom: 58px; right: 16px; pointer-events: auto; background: var(--glass);
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; display: flex; gap: 10px; align-items: center; }
#majors { width: 150px; accent-color: #7fb0ff; }
/* the way off this page: the measured findings, generated from the verdict files by
   tools/findings.mjs. It sits above the grow control at every width, because both panels
   that could collide with it are on the other side or under it. */
#findings { position: fixed; bottom: 106px; right: 16px; pointer-events: auto; background: var(--glass);
  border: 1px solid var(--line); border-radius: 10px; padding: 7px 13px; color: var(--ink);
  text-decoration: none; letter-spacing: 0.16em; text-transform: uppercase; font-size: 11px;
  backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px); }
#findings:hover { border-color: #7fb0ff; text-shadow: 0 0 12px rgba(127,176,255,0.55); }
/* the portfolio: docs/PORTFOLIO.md rendered whole at build time by tools/portfolio-page.mjs,
   copyable, always the current file. Same pill, one row above findings. */
#portfolio { position: fixed; bottom: 146px; right: 16px; pointer-events: auto; background: var(--glass);
  border: 1px solid var(--line); border-radius: 10px; padding: 7px 13px; color: var(--ink);
  text-decoration: none; letter-spacing: 0.16em; text-transform: uppercase; font-size: 11px;
  backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px); }
#portfolio:hover { border-color: #7fb0ff; text-shadow: 0 0 12px rgba(127,176,255,0.55); }
/* the ladder: his P4 ruler, rendered from the verdict files at build time by web/ladder.mjs.
   Same pill, one row above portfolio. */
#ladder { position: fixed; bottom: 186px; right: 16px; pointer-events: auto; background: var(--glass);
  border: 1px solid var(--line); border-radius: 10px; padding: 7px 13px; color: var(--ink);
  text-decoration: none; letter-spacing: 0.16em; text-transform: uppercase; font-size: 11px;
  backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px); }
#ladder:hover { border-color: #7fb0ff; text-shadow: 0 0 12px rgba(127,176,255,0.55); }
/* the daemon rows in the state panel */
.on { color: #7fb0ff; }
.off { color: #ffb27f; }
/* the prompt box (queue item 12, his 11:32 and 11:55 EDT words): the organism's exact reader runs in this
   tab (web/ask.mjs copies it into organism/), so a visitor asks and the answer comes back with its
   provenance and the nanoseconds it took on their device. The full terminal is at /ask. */
#ask { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); width: 520px; z-index: 3; pointer-events: auto;
  background: var(--glass); border: 1px solid rgba(127,176,255,0.45); border-radius: 10px; padding: 9px 12px;
  backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px); box-shadow: 0 0 24px rgba(127,176,255,0.10); }
#ask form { display: flex; gap: 8px; align-items: center; margin: 0; }
#ask .lbl { letter-spacing: 0.16em; text-transform: uppercase; font-size: 11px; color: #7fb0ff; white-space: nowrap; }
#askq { flex: 1; min-width: 0; background: #060913; color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; font: inherit; font-size: 13px; }
#askq:focus { outline: none; border-color: #7fb0ff; }
#ask a { color: var(--dim); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; white-space: nowrap; }
#ask a:hover { color: var(--ink); }
#askout { margin-top: 6px; max-height: 30vh; overflow: auto; overflow-wrap: anywhere; }
#askout:empty { display: none; }
#askout .v { font-size: 18px; color: #7fffb0; }
#askout .w { color: #ffb27f; }
@media (max-width: 1240px) {
  #ask { left: 16px; right: 16px; width: auto; transform: none; }
  .state, .conduits { top: 128px !important; }
}
@media (max-width: 820px) {
  .state { top: 150px !important; }
  #askout { max-height: 4.8em; }
}
@media (max-width: 820px) {
  .conduits { display: none; }
  .state, .cell { width: calc(100% - 32px); }
  .cell { bottom: 110px; max-height: 40vh; }
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"></div>
<div id="grow"><span class="dim">majors</span><input id="majors" type="range" min="200" max="5000" step="100" value="1200"><span id="majorsOut">1200</span></div>
<a id="ladder" href="ladder/">ladder</a>
<a id="portfolio" href="portfolio/">portfolio</a>
<a id="findings" href="findings/">findings</a>
<a id="handoff" href="handoff/" style="position: fixed; bottom: 226px; right: 16px; pointer-events: auto; background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 7px 13px; color: var(--ink); text-decoration: none; letter-spacing: 0.16em; text-transform: uppercase; font-size: 11px; backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);">handoff</a>
<div id="ask"><form id="askf" autocomplete="off"><span class="lbl">ask</span><input id="askq" placeholder="what is 17 times 23" spellcheck="false" aria-label="ask the organism"><a id="askterm" href="/ask">terminal</a></form><div id="askout" aria-live="polite"></div></div>
<script type="module">
import { readExact } from './organism/act/exact-read.mjs';
let word = null;
try { word = (await import('./organism/act/word.mjs')).readWord; } catch { word = null; }
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const answer = (t) => readExact(t, word ? { word } : {});
function nsPerAsk(t) {
  for (let i = 0; i < 20; i++) answer(t);
  let n = 8;
  for (;;) { const a = performance.now(); for (let i = 0; i < n; i++) answer(t); if (performance.now() - a >= 2 || n >= 1 << 20) break; n *= 2; }
  const b = [];
  for (let k = 0; k < 7; k++) { const a = performance.now(); for (let i = 0; i < n; i++) answer(t); b.push((performance.now() - a) * 1e6 / n); }
  return Math.round(b.sort((x, y) => x - y)[3]);
}
const out = document.getElementById('askout');
document.getElementById('askf').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const q = document.getElementById('askq').value.trim(); if (!q) return;
  document.getElementById('askterm').href = '/ask?q=' + encodeURIComponent(q);
  const r = answer(q);
  out.innerHTML = r
    ? '<span class="v">' + esc(r.answer) + '</span> <span class="dim">exact (' + esc(r.method) + '), no model, 0 tokens, ' + nsPerAsk(q).toLocaleString('en-US') + ' ns per ask on this device</span>'
    : '<span class="w">refused, not guessed:</span> <span class="dim">no cell in this tab carries it (0 tokens).</span> <a href="/ask?q=' + encodeURIComponent(q) + '">ask the organism on the server</a> <span class="dim">(the terminal posts it to /api/ask and prints its route)</span>';
});
</script>
<div id="boot">growing</div>
<script src="app.js"></script>
</body>
</html>
